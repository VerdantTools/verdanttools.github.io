<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Humanizer Studio</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --border: #e2e8f0;
        --border-hover: #cbd5e1;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --success: #16a34a;
        --error-bg: #fef2f2;
        --error-border: #fecaca;
        --error-text: #991b1b;
        --shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }

      .app-wrapper {
        width: 100%;
        max-width: 1100px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.01em;
      }

      .endpoint-tag {
        font-family: monospace;
        font-size: 0.8rem;
        background: #f1f5f9;
        color: var(--text-muted);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--success);
        border-radius: 50%;
      }

      .controls-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        background: var(--panel);
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .controls-bar label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      select {
        background: #ffffff;
        color: var(--text-main);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: 500;
        outline: none;
        cursor: pointer;
      }

      select:focus {
        border-color: var(--primary);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .card-title {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }

      .stats {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      textarea {
        width: 100%;
        height: 320px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: var(--text-main);
        background: #fafafa;
        resize: vertical;
        font-family: inherit;
        outline: none;
        transition:
          border-color 0.15s,
          background-color 0.15s;
      }

      textarea:focus {
        background: #ffffff;
        border-color: var(--primary);
      }

      textarea[readonly] {
        background: #f8fafc;
      }

      .action-bar {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .btn-primary {
        background-color: var(--primary);
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #ffffff;
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 4px 10px;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
      }

      .btn-secondary:hover {
        border-color: var(--border-hover);
        background: #f8fafc;
      }

      .error-msg {
        margin-top: 16px;
        padding: 12px 16px;
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        color: var(--error-text);
        font-size: 0.85rem;
        border-radius: 6px;
        display: none;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-wrapper">
      <header>
        <h1>Text Humanizer</h1>
        <div class="endpoint-tag">
          <span class="status-dot"></span> human.doxywave.dpdns.org
        </div>
      </header>

      <div class="controls-bar">
        <label for="modeSelect">Rewrite Mode:</label>
        <select id="modeSelect">
          <option value="standard">Standard</option>
          <option value="fluent">Fluent</option>
          <option value="creative">Creative</option>
          <option value="academic">Academic</option>
        </select>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Input</span>
            <span class="stats" id="inputStats">0 words / 0 chars</span>
          </div>
          <textarea
            id="inputText"
            placeholder="Enter text to paraphrase..."
          ></textarea>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Output</span>
            <div style="display: flex; align-items: center; gap: 8px">
              <span class="stats" id="outputStats">0 words / 0 chars</span>
              <button
                class="btn-secondary"
                id="copyBtn"
                onclick="copyOutput()"
                style="display: none"
              >
                Copy
              </button>
            </div>
          </div>
          <textarea
            id="outputText"
            placeholder="Result will appear here..."
            readonly
          ></textarea>
        </div>
      </div>

      <div id="errorDisplay" class="error-msg"></div>

      <div class="action-bar">
        <div></div>
        <button class="btn-primary" id="submitBtn" onclick="processText()">
          <div class="spinner" id="btnSpinner"></div>
          <span id="btnText">Humanize</span>
        </button>
      </div>
    </div>

    <script>
      const API_URL = "https://human.doxywave.dpdns.org/humanize";

      const inputArea = document.getElementById("inputText");
      const outputArea = document.getElementById("outputText");
      const inputStats = document.getElementById("inputStats");
      const outputStats = document.getElementById("outputStats");
      const modeSelect = document.getElementById("modeSelect");
      const submitBtn = document.getElementById("submitBtn");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnText = document.getElementById("btnText");
      const errorDisplay = document.getElementById("errorDisplay");
      const copyBtn = document.getElementById("copyBtn");

      function updateMetrics(element, text) {
        const trimmed = text.trim();
        const words = trimmed ? trimmed.split(/\s+/).length : 0;
        const chars = text.length;
        element.textContent = `${words} words / ${chars} chars`;
      }

      inputArea.addEventListener("input", () => {
        updateMetrics(inputStats, inputArea.value);
      });

      async function processText() {
        const input = inputArea.value.trim();

        errorDisplay.style.display = "none";
        errorDisplay.textContent = "";

        if (!input) {
          outputArea.value = "";
          updateMetrics(outputStats, "");
          copyBtn.style.display = "none";
          return;
        }

        submitBtn.disabled = true;
        btnSpinner.style.display = "block";
        btnText.textContent = "Processing";

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              text: input,
              mode: modeSelect.value,
            }),
          });

          if (!response.ok) {
            throw new Error(`HTTP Error ${response.status}`);
          }

          const data = await response.json();

          if (data.error) {
            throw new Error(data.error);
          }

          const resultText = data.result || "";
          outputArea.value = resultText;
          updateMetrics(outputStats, resultText);

          if (resultText) {
            copyBtn.style.display = "inline-block";
          }
        } catch (err) {
          errorDisplay.textContent = `Connection failed: ${err.message}`;
          errorDisplay.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          btnSpinner.style.display = "none";
          btnText.textContent = "Humanize";
        }
      }

      function copyOutput() {
        if (!outputArea.value) return;
        navigator.clipboard.writeText(outputArea.value).then(() => {
          copyBtn.textContent = "Copied";
          setTimeout(() => {
            copyBtn.textContent = "Copy";
          }, 1500);
        });
      }
    </script>
  </body>
</html>
