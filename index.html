<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paste to Download</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="pastearea">
      <p>
        <span>Ctrl</span> <span>V</span> to paste <br />or<br />
        <span class="textpaste">Paste a link here</span>
      </p>
      <div class="bottom">
        <p>Options:</p>
        <div class="options">
            <div class="filename">
                <input>
            </div>
            <div class="format">
                <button class="active" data-format="image/png">PNG</button>
                <button data-format="image/jpeg">JPG</button>
                <button data-format="image/webp">WebP</button>
            </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
