<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paste Image to Download - PNG, JPG & WebP</title>

    <meta property="og:title" content="Paste Image to Download" />
    <meta
      name="description"
      content="Paste an image and download it as PNG, JPG or WebP."
    />
    <meta property="og:type" content="website" />

    <link
      rel="canonical"
      href="https://untitledbase.dpdns.org/PasteToDownload/"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="pastearea">
      <h1 class="hidden" style="font-size: 40pt; color: rgb(0, 157, 255)">
        Downloading..
      </h1>

      <main>
        <p class="paste-message">
          <span>Ctrl</span> <span>V</span> to paste
          <br />
          or
          <br />
          <a class="textpaste">
            Paste a link here
            <input style="text-decoration: none" placeholder="Put link here" />
          </a>
        </p>

        <div class="bottom">
          <p class="options-title">Options</p>

          <div class="options">
            <div class="filename">
              <input
                type="text"
                id="filename-input"
                placeholder="Filename (optional)"
              />
            </div>

            <div class="format">
              <button class="active" data-format="image/png">PNG</button>
              <button data-format="image/jpeg">JPG</button>
              <button data-format="image/webp">WebP</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="index.js"></script>
  </body>
</html>
